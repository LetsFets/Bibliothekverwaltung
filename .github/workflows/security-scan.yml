name: DevSecOps V7 - Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: 'auto erkennt die drei Projekte; alternativ . oder ordner1,ordner2'
        type: string
        default: auto
        required: true
      zap_mode:
        description: 'baseline = passiv; full = aktive Angriffe auf frische lokale Testkopie'
        type: choice
        options: [baseline, full]
        default: baseline
        required: true
      enforce:
        description: 'Auch bei Sicherheitsfunden fehlschlagen (technische Fehler immer rot)'
        type: boolean
        default: false
      selftest:
        description: 'Zusätzlich den Scanner gegen eine kleine Testseite prüfen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devsecops-v7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Projekte erkennen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pipeline-Regressionstests
        run: |
          python3 -m pip install PyYAML==6.0.3
          env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY python3 -m unittest discover -s .github/devsecops/tests -v
      - name: Projektmatrix
        id: projects
        env:
          PROJECTS: ${{ inputs.projects || 'auto' }}
        run: python3 .github/devsecops/discover.py --projects "$PROJECTS"

  code-security:
    name: Static - ${{ matrix.path }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Semgrep, Gitleaks und Trivy auf unverändertem Quellcode
        env:
          PROJECT: ${{ matrix.path }}
          ENFORCE: ${{ inputs.enforce || false }}
          REPORTS: ${{ runner.temp }}/devsecops-static
        run: python3 .github/devsecops/scan.py --static-only --projects "$PROJECT" --enforce "$ENFORCE" --output "$REPORTS"
      - name: Static-Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-static-${{ matrix.id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-static/
          if-no-files-found: error
          retention-days: 7

  zap-project:
    name: ZAP - ${{ matrix.path }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Echte Anwendung mit Testdaten starten und scannen
        env:
          PROJECT: ${{ matrix.path }}
          ZAP_MODE: ${{ inputs.zap_mode || 'baseline' }}
          ENFORCE: ${{ inputs.enforce || false }}
          REPORTS: ${{ runner.temp }}/devsecops-zap
        run: python3 .github/devsecops/project_scan.py --project "$PROJECT" --mode "$ZAP_MODE" --enforce "$ENFORCE" --output "$REPORTS"
      - name: ZAP-Reports und Startdiagnose
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-zap-${{ matrix.id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-zap/
          if-no-files-found: error
          retention-days: 7

  zap-selftest:
    name: Optionaler Scanner-Selbsttest
    if: github.event_name == 'workflow_dispatch' && inputs.selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Isolierte Testseite scannen
        env:
          REPORTS: ${{ runner.temp }}/devsecops-selftest
        run: python3 .github/devsecops/web_scan.py --root . --target selftest --mode baseline --output "$REPORTS"
      - name: Selftest-Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v7-selftest-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-selftest/
          if-no-files-found: error
          retention-days: 7
