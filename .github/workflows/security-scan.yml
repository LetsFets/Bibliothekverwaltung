name: DevSecOps V9 - Security Pipeline (Dalfox XSS)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: 'auto erkennt die drei Projekte; alternativ . oder ordner1,ordner2'
        type: string
        default: auto
        required: true
      enforce:
        description: 'Auch bei Sicherheitsfunden fehlschlagen (technische Fehler immer rot)'
        type: boolean
        default: false
      selftest:
        description: 'Zusätzlich den Scanner gegen eine kleine Testseite prüfen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devsecops-v9-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Projekte erkennen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pipeline-Regressionstests
        run: |
          python3 -m pip install PyYAML==6.0.3
          env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY python3 -m unittest discover -s .github/devsecops/tests -v
      - name: Projektmatrix
        id: projects
        env:
          PROJECTS: ${{ inputs.projects || 'auto' }}
        run: python3 .github/devsecops/discover.py --projects "$PROJECTS"

  code-security:
    name: Static - ${{ matrix.path }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Semgrep, Gitleaks und Trivy auf unverändertem Quellcode
        env:
          PROJECT: ${{ matrix.path }}
          ENFORCE: ${{ inputs.enforce || false }}
          REPORTS: ${{ runner.temp }}/devsecops-static
        run: python3 .github/devsecops/scan.py --static-only --projects "$PROJECT" --enforce "$ENFORCE" --output "$REPORTS"
      - name: Static-Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-static-${{ matrix.id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-static/
          if-no-files-found: error
          retention-days: 7

  dalfox-project:
    name: Dalfox XSS - ${{ matrix.path }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Dalfox v3.2.4 installieren und SHA256 prüfen
        run: bash .github/devsecops/install_dalfox.sh
      - name: Echte Anwendung mit Testdaten starten und XSS mit Dalfox prüfen
        env:
          PROJECT: ${{ matrix.path }}
          ENFORCE: ${{ inputs.enforce || false }}
          REPORTS: ${{ runner.temp }}/devsecops-dalfox
        run: python3 .github/devsecops/project_scan.py --project "$PROJECT" --enforce "$ENFORCE" --output "$REPORTS"
      - name: Dalfox-Reports und Startdiagnose
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-dalfox-${{ matrix.id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-dalfox/
          if-no-files-found: error
          retention-days: 7

  dalfox-selftest:
    name: Optionaler Dalfox-Selbsttest
    if: github.event_name == 'workflow_dispatch' && inputs.selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dalfox v3.2.4 installieren und SHA256 prüfen
        run: bash .github/devsecops/install_dalfox.sh
      - name: Isolierte Testseite scannen
        env:
          REPORTS: ${{ runner.temp }}/devsecops-selftest
        run: |
          python3 .github/devsecops/project_scan.py --selftest --output "$REPORTS"
          python3 .github/devsecops/verify_selftest.py "$REPORTS/summary.json"
      - name: Selftest-Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-selftest-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-selftest/
          if-no-files-found: error
          retention-days: 7

  security-summary:
    name: Gesamtauswertung aller Projekte
    if: always()
    needs: [discover, code-security, dalfox-project]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scanner- und Dalfox-Artefakte herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: v9-*
          merge-multiple: false
          path: ${{ runner.temp }}/devsecops-collection
      - name: Bewertbare Projektübersicht erstellen
        env:
          MATRIX: ${{ needs.discover.outputs.matrix }}
          PREVIOUS_JOBS: ${{ needs.discover.result }} / ${{ needs.code-security.result }} / ${{ needs.dalfox-project.result }}
          ENFORCE: ${{ inputs.enforce || false }}
        run: |
          python3 .github/devsecops/aggregate.py \
            --input "${{ runner.temp }}/devsecops-collection" \
            --output "${{ runner.temp }}/devsecops-overview" \
            --matrix "$MATRIX" --enforce "$ENFORCE"
      - name: Gesamtbericht zum Herunterladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v9-overview-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-overview/
          if-no-files-found: error
          retention-days: 7
