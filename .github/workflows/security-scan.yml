name: DevSecOps V6 - Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Verzeichnisse für Semgrep, Gitleaks, Trivy (z.B. . oder frontend,backend)'
        required: true
        type: string
        default: '.'
      zap_target:
        description: 'Selftest immer; project startet ZUSAETZLICH die echte Webapp'
        type: choice
        options: [selftest, project]
        default: selftest
        required: true
      zap_mode:
        description: 'Full = aktiver Scan NUR gegen isolierte Test-Instanz'
        type: choice
        options: [baseline, full]
        default: baseline
        required: true
      enforce:
        description: 'Bei gefundenen Schwachstellen fehlgeschlagen markieren'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: devsecops-v6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-security:
    name: Semgrep / Gitleaks / Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Statische Sicherheitspruefungen
        env:
          PROJECTS: ${{ github.event_name == 'workflow_dispatch' && inputs.projects || '.' }}
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce || false }}
          REPORTS: ${{ runner.temp }}/devsecops-static
        run: |
          python3 .github/devsecops/scan.py --static-only \
            --projects "$PROJECTS" --enforce "$ENFORCE" --output "$REPORTS"
      - name: Static-Reports hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-static-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-static/
          if-no-files-found: warn
          retention-days: 7

  zap-selftest:
    name: OWASP ZAP - isolierter Self-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: ZAP gegen eigenstaendige lokale Python-Testseite
        env:
          REPORTS: ${{ runner.temp }}/devsecops-zap-selftest
        run: |
          python3 .github/devsecops/web_scan.py --root . --target selftest \
            --mode baseline --output "$REPORTS"
      - name: ZAP-Self-Test-Reports hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-zap-selftest-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-zap-selftest/
          if-no-files-found: warn
          retention-days: 7

  zap-project:
    name: OWASP ZAP - echte lokale Webanwendung
    # Realprojekt nur auf manuelle Anforderung oder nach Aktivierung der Repo-Variable.
    # Keine Secrets aus untrusted Pull Requests an die Web-App durchreichen.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.zap_target == 'project') ||
      (github.event_name == 'push' && vars.DEVSECOPS_AUTO_PROJECT_SCAN == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Setup Node.js (fuer JS-/TS-Anwendungen)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Web-App lokal starten und mit ZAP testen
        env:
          REPORTS: ${{ runner.temp }}/devsecops-zap-project
          ZAP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.zap_mode || 'baseline' }}
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce || false }}
          # Nur Test-Secrets bereitstellen. Nie produktive Datenbanken verwenden.
          DATABASE_URL: ${{ secrets.DEVSECOPS_DATABASE_URL }}
          DATABASE_AUTH_SECRET: ${{ secrets.DEVSECOPS_DATABASE_AUTH_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.DEVSECOPS_BETTER_AUTH_SECRET }}
        run: |
          python3 .github/devsecops/web_scan.py --root . --target project \
            --mode "$ZAP_MODE" --enforce "$ENFORCE" --output "$REPORTS"
      - name: ZAP-Projekt-Reports hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v6-zap-project-${{ github.run_number }}
          path: ${{ runner.temp }}/devsecops-zap-project/
          if-no-files-found: warn
          retention-days: 7
